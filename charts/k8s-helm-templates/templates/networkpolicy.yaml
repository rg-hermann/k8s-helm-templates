{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-helm-templates.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "k8s-helm-templates.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-helm-templates.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  
  # Allow ingress from nginx ingress controller and same namespace
  ingress:
    - from:
        # From ingress controller
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    
    # From same namespace (service-to-service)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  
  # Allow egress
  egress:
    # Allow to same namespace pods
    - to:
        - podSelector: {}
    
    # Allow to other namespaces (if needed)
    - to:
        - namespaceSelector: {}
    
    # DNS (port 53)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    
    # HTTPS (port 443)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
