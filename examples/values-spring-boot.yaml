# Example values for deploying a Spring Boot Java application

image:
  repository: ghcr.io/myorg/java-api  # Change to your registry
  tag: v1.0.0
  pullPolicy: IfNotPresent

replicaCount: 2

containerPort: 8080

# Spring Boot exposes health endpoints via /actuator
probes:
  enabled: true

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 40
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 2

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  SPRING_PROFILES_ACTIVE: "production"
  LOG_LEVEL: "INFO"
  JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

config:
  application.yml: |
    spring:
      application:
        name: my-api
      jpa:
        hibernate:
          ddl-auto: validate

secrets:
  DATABASE_URL: "jdbc:postgresql://postgres:5432/myapp"
  DATABASE_PASSWORD: "your-password-here"
  SPRING_JPA_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQL10Dialect"

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
